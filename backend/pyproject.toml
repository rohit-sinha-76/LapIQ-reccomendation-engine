[build-system]
requires = ["setuptools==69.0.0", "wheel==0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lapiq"
version = "3.1.0"
description = "LapIQ — Laptop Purchase Intelligence Platform (India)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.30.0",
    "redis==8.0.0",
    "pydantic==2.13.0",
    "pydantic-settings==2.7.0",
    "google-genai==1.0.0",
    "alembic==1.14.0",
    "pgvector==0.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.9.0",
    "mypy==1.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "C901", "UP"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]

[tool.coverage.run]
omit = [
    "*/infrastructure/database/seed.py",
    "*/infrastructure/database/seed_csv.py",
]
