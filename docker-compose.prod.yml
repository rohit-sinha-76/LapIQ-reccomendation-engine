version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: lapiq_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    command: uvicorn lapiq.api.main:app --host 0.0.0.0 --port 8000 --workers 4
    volumes: []

  frontend:
    command: npm run start
    volumes: []

  worker:
    volumes: []
