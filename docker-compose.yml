version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lapiq_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lapiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lapiq_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lapiq_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lapiq} -d ${POSTGRES_DB:-lapiq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.0-alpine
    container_name: lapiq_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lapiq_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-secret-key-32-chars-min}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://lapiq:lapiq_dev_password@postgres:5432/lapiq_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./scripts:/app/scripts

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lapiq_worker
    restart: always
    command: python -m lapiq.infrastructure.worker.scheduler
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-secret-key-32-chars-min}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://lapiq:lapiq_dev_password@postgres:5432/lapiq_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./scripts:/app/scripts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lapiq_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
